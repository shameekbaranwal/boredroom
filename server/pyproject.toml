[project]
name = "boredroom"
version = "0.1.0"
description = "Daily puzzle leaderboard for friends"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.0",
    "google-auth>=2.30",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boredroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
