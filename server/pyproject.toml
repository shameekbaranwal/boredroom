[project]
name = "boredroom"
version = "0.1.0"
description = "Daily puzzle leaderboard for friends"
requires-python = ">=3.12"
dependencies = ["flask>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boredroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
